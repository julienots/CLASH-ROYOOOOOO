name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Outils Android
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner zipalign dalvik-exchange android-sdk-platform-23
      - run: npm ci
      - name: Keystore (secret optionnel)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/essence-arena.keystore; fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS || 'superessence' }}
        run: ./scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EssenceArena-apk
          path: dist/EssenceArena.apk
